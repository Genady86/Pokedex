<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Pokedex</title>

        <link rel="icon" href="./assets/img/favicon.ico" />
        <link rel="stylesheet" href="pokemon-styles-v2.css" />
    </head>

    <body>
        <header>
            <h1>Pokedex</h1>

            <input
                id="search-input"
                data-id="search-input"
                type="search"
                placeholder="Search Pokémon..."
                autocomplete="off"
            />

            <button id="search-button" data-id="search-button" aria-label="Search Pokemon">
                Search
            </button>
        </header>

        <main data-id="content">
            <div id="loading-spinner" class="d-none">Pokémon are loading...</div>

            <ul id="pokemon-container" class="pokemon-container"></ul>

            <button id="load-more-button" data-id="load-more-button" aria-label="Load more Pokemon">
                Load More
            </button>
        </main>

        <dialog id="pokemon-dialog" aria-label="Pokemon details">
            <button aria-label="Close Pokemon details" onclick="closePokemonDialog()">Close</button>
        </dialog>

        <script src="global-var.js"></script>
        <script src="pokemon-projekt-v2.js"></script>
    </body>
</html>
