<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Pokedex</title>

        <link rel="icon" href="./assets/img/favicon.ico" />
        <link rel="stylesheet" href="./css/pokemon-styles-v2.css" />
        <link rel="stylesheet" href="./css/dialog.css" />
        <link rel="stylesheet" href="./css/dark-mode.css" />
        <link rel="stylesheet" href="./css/responsive.css" />
    </head>

    <body>
        <header>
            <div class="header-title">
                <img class="header-logo" src="./assets/img/favicon.ico" alt="Pokedex logo" />
                <h1>Pokedex</h1>
            </div>

            <!-- Search -->
            <input
                id="search-input"
                data-id="search-input"
                type="search"
                placeholder="Search Pokémon..."
                autocomplete="off"
            />
            <button id="search-button" data-id="search-button" aria-label="Search Pokemon" disabled>
                Search
            </button>
            <button id="theme-button" aria-label="Switch color theme">Dark</button>
        </header>

        <main data-id="content">
            <!-- Loading -->
            <div id="loading-spinner" class="d-none">Pokémon are loading...</div>

            <!-- Pokemon cards -->
            <ul id="pokemon-container" class="pokemon-container"></ul>

            <!-- Load more -->
            <button id="load-more-button" data-id="load-more-button" aria-label="Load more Pokemon">
                Load More
            </button>
        </main>

        <!-- Pokemon dialog -->
        <dialog
            id="pokemon-dialog"
            aria-label="Pokemon details"
            onclick="closeDialogOnOutside(event)"
        ></dialog>

        <script src="./js/global-var.js"></script>
        <script src="./js/pokemon-api.js"></script>
        <script src="./js/pokemon-templates.js"></script>
        <script src="./js/pokemon-dialog.js"></script>
        <script src="./js/pokemon-projekt-v2.js"></script>
    </body>
</html>
